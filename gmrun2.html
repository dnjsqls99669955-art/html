<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body style="margin:0;background:#f4f5f2">
<!--MCV_FRAGMENT_START-->
<style>#mcv-root{--blue:#1976d2;--dark:#263238;--bg:#f4f6f8;--card:#fff;--line:#e0e4e8;}
#mcv-root, #mcv-root *:where(:not(#mcv-rvPano *)){margin:0;padding:0;box-sizing:border-box;}
#mcv-root{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;background:var(--bg);color:var(--dark);}
#mcv-root .mcv-wrap{max-width:1100px;margin:0 auto;padding:16px;}
#mcv-root header{background:linear-gradient(135deg,#0d47a1,#1976d2);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:16px;}
#mcv-root header.admin{background:linear-gradient(135deg,#263238,#455a64);}
#mcv-root header h1{font-size:1.5rem;margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
#mcv-root header .mcv-tag{font-size:.7rem;background:rgba(255,255,255,.22);border-radius:20px;padding:3px 11px;font-weight:700;}
#mcv-root header p{opacity:.9;font-size:.9rem;}
#mcv-root .mcv-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center;}
#mcv-root .mcv-stat{background:rgba(255,255,255,.15);border-radius:10px;padding:8px 14px;font-size:.85rem;}
#mcv-root .mcv-stat b{font-size:1.05rem;display:block;}
#mcv-root .mcv-kakao-open{margin-left:auto;background:#fee500;color:#191919;font-weight:700;border-radius:10px;padding:10px 16px;font-size:.85rem;text-decoration:none;}
#mcv-root .mcv-card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden;}
#mcv-root .mcv-card h2{font-size:1.05rem;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
#mcv-root .mcv-seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:.75rem;font-weight:400;}
#mcv-root .mcv-seg button{padding:6px 12px;border:none;background:#fff;cursor:pointer;font-size:.75rem;color:#455a64;}
#mcv-root .mcv-seg button:not(:last-child){border-right:1px solid var(--line);}
#mcv-root .mcv-seg button.mcv-on{background:var(--blue);color:#fff;font-weight:700;}
#mcv-root .mcv-seg.mcv-course button.mcv-on{background:#2e7d32;}
#mcv-root .mcv-seg.mcv-kk button.mcv-on{background:#fee500;color:#191919;}
#mcv-root #mcv-mapWrap{position:relative;}
#mcv-root #mcv-map{height:520px;width:100%;background:#e8edf2;}
#mcv-root #mcv-mapErr{position:absolute;inset:0;background:rgba(244,246,248,.97);display:none;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:1500;}
#mcv-root #mcv-mapErr .mcv-in{max-width:520px;font-size:.85rem;line-height:1.8;color:#455a64;}
#mcv-root #mcv-mapErr code{background:#e8edf2;border-radius:4px;padding:2px 6px;}
#mcv-root .mcv-legend{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;font-size:.75rem;font-weight:400;}
#mcv-root .mcv-chip{display:inline-flex;align-items:center;gap:5px;background:#f0f3f6;border-radius:20px;padding:3px 10px;}
#mcv-root .mcv-dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
#mcv-root .mcv-locate-btn{position:absolute;z-index:1200;bottom:26px;right:18px;width:52px;height:52px;background:#fff;border:none;border-radius:50%;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:#546e7a;transition:.2s;}
.leaflet-container{font:inherit;background:#e8edf2;}
#mcv-root .mcv-lfIcon{background:none!important;border:none!important;}
#mcv-root .mcv-lfIcon>*{position:absolute;transform:translate(-50%,-50%);}
.leaflet-popup-content{margin:11px 13px;font-size:.83rem;line-height:1.6;}
.leaflet-popup-content-wrapper{border-radius:10px;}
#mcv-root .mcv-locate-btn:hover{transform:scale(1.08);}
#mcv-root .mcv-locate-btn svg{width:24px;height:24px;stroke:currentColor;}
#mcv-root .mcv-locate-btn.tracking{background:var(--blue);color:#fff;}
#mcv-root .mcv-my-dot{width:16px;height:16px;background:#1976d2;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.4);}
#mcv-root #mcv-chartBox{position:relative;padding:10px 14px 14px;}
#mcv-root #mcv-elev{width:100%;height:230px;display:block;cursor:crosshair;}
#mcv-root #mcv-tooltip{position:absolute;pointer-events:none;background:rgba(38,50,56,.94);color:#fff;padding:8px 11px;border-radius:8px;font-size:.78rem;line-height:1.5;display:none;white-space:nowrap;z-index:10;}
#mcv-root .mcv-tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;padding:16px;}
#mcv-root .mcv-tables>div{min-width:0;overflow-x:auto;}
#mcv-root table:where(:not(#mcv-rvPano *)){width:100%;border-collapse:collapse;font-size:.85rem;}
#mcv-root th:where(:not(#mcv-rvPano *)){background:#f7f9fb;text-align:left;padding:9px 11px;border-bottom:2px solid var(--line);font-size:.77rem;color:#607d8b;white-space:nowrap;}
#mcv-root td:where(:not(#mcv-rvPano *)){padding:9px 11px;border-bottom:1px solid #eef1f4;}
#mcv-root tr:where(:not(#mcv-rvPano *)).mcv-row{cursor:pointer;}
#mcv-root tr:where(:not(#mcv-rvPano *)).mcv-row:hover{background:#eef6ff;}
#mcv-root td:where(:not(#mcv-rvPano *)).mcv-km{font-weight:700;white-space:nowrap;width:1%;font-variant-numeric:tabular-nums;}
#mcv-root td:where(:not(#mcv-rvPano *)).mcv-qty{text-align:right;font-variant-numeric:tabular-nums;width:1%;}
#mcv-root tfoot:where(:not(#mcv-rvPano *)) td{font-weight:800;background:#f7f9fb;border-top:2px solid var(--line);}
#mcv-root .mcv-titleicon{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff;}
#mcv-root .mcv-note{font-size:.75rem;color:#78909c;padding:10px 18px 14px;line-height:1.6;}
#mcv-root .mcv-kpoi{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;width:28px;height:28px;cursor:pointer;}
#mcv-root .mcv-kkm{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer;}
/* km 표시 — 점은 코스 선 위 정확한 지점, 숫자는 화면상으로만 비켜서 겹침을 피한다 */
#mcv-root .mcv-kmMark{position:relative !important;width:0 !important;height:0 !important;overflow:visible !important;}
#mcv-root .mcv-kmDot{position:absolute !important;left:0 !important;top:0 !important;
  width:7px !important;height:7px !important;margin:0 !important;padding:0 !important;
  transform:translate(-50%,-50%) !important;border-radius:50% !important;background:#fff !important;
  border:2px solid var(--kc,#e53935) !important;box-shadow:0 0 0 1px rgba(0,0,0,.3) !important;}
#mcv-root .mcv-kmLine{position:absolute !important;margin:0 !important;padding:0 !important;
  background:var(--kc,#e53935) !important;opacity:.75 !important;pointer-events:none !important;}
#mcv-root .mcv-kmMark .mcv-kkm{position:absolute !important;left:0 !important;top:0 !important;margin:0 !important;
  transform:translate(-50%,-50%) translate(var(--kx,0px), var(--ky,-20px)) !important;}
#mcv-root .mcv-kstart{background:#2e7d32;color:#fff;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.4);border:2px solid #fff;}
#mcv-root .mcv-kturn{background:#f57c00;color:#fff;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.4);border:2px solid #fff;cursor:pointer;}
#mcv-root .mcv-kLane{background:#fff;color:var(--lc,#e53935);border:2px solid var(--lc,#e53935);
  border-radius:999px;padding:2px 8px 2px 7px;font-size:12px;font-weight:700;letter-spacing:-.1px;
  line-height:1.35;white-space:nowrap;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2);
  font-variant-numeric:tabular-nums;}
#mcv-root .mcv-kLane b{font-weight:800;font-size:12px;margin-right:2px;letter-spacing:-.5px;}
#mcv-root .mcv-kLane i{font-style:normal;font-weight:600;font-size:10px;opacity:.75;margin-left:1px;}
#mcv-root .mcv-kLane.p1{border-style:dashed;}
#mcv-root .mcv-kLane.p2{border-style:dotted;}
#mcv-root .mcv-kLane.p3{border-style:double;border-width:3px;}
#mcv-root .mcv-kinfo{position:relative;background:#fff;border:1px solid #cfd8dc;border-radius:10px;padding:11px 28px 11px 13px;font-size:.83rem;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,.28);white-space:nowrap;}
#mcv-root .mcv-kinfo:after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0;}
#mcv-root .mcv-kinfo .mcv-x{position:absolute;top:4px;right:7px;cursor:pointer;color:#90a4ae;font-size:14px;font-weight:700;}
#mcv-root .mcv-sumchips{display:flex;gap:9px;flex-wrap:wrap;padding:16px 16px 0;}
#mcv-root .mcv-sumchip{background:#eceff1;border-radius:10px;padding:9px 14px;font-size:.78rem;color:#455a64;}
#mcv-root .mcv-sumchip b{display:block;font-size:1.05rem;color:#263238;margin-top:2px;}
#mcv-root .mcv-printbtn{background:#37474f;color:#fff;border:none;border-radius:9px;padding:7px 13px;font-size:.75rem;font-weight:700;cursor:pointer;}
#mcv-root .mcv-ops{white-space:nowrap;font-variant-numeric:tabular-nums;color:#455a64;}
@media (max-width:900px){
  #mcv-root #mcv-map{height:62dvh;min-height:300px;}
  #mcv-root .mcv-wrap{padding:12px;}
  #mcv-root .mcv-tables{grid-template-columns:1fr;}
}
@media (max-width:640px){
  #mcv-root #mcv-elev{height:180px;}
  #mcv-root table:where(:not(#mcv-rvPano *)){font-size:.8rem;}
  #mcv-root th:where(:not(#mcv-rvPano *)), #mcv-root td:where(:not(#mcv-rvPano *)){padding:8px;}
  #mcv-root .mcv-card h2{padding:12px;gap:8px;}
  #mcv-root .mcv-legend{margin-left:0;}
  /* 휴대전화 — 화면 폭에 맞춰 접는다 */
  #mcv-root .mcv-wrap{padding:9px;}
  #mcv-root header{padding:15px 16px;border-radius:12px;margin-bottom:10px;}
  #mcv-root header h1{font-size:1.18rem;gap:7px;}
  #mcv-root header p{font-size:.82rem;}
  #mcv-root #mcv-map{height:58dvh;min-height:270px;}
  #mcv-root .mcv-card{margin-bottom:10px;}
  #mcv-root .mcv-tables{padding:10px;gap:10px;}
  #mcv-root .mcv-tables>div{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  #mcv-root .mcv-sumchips{padding:10px 10px 0;gap:6px;}
  #mcv-root .mcv-sumchip{padding:8px 11px;font-size:.74rem;}
  #mcv-root .mcv-seg button{padding:9px 12px;font-size:.75rem;}
  #mcv-root .mcv-printbtn{padding:9px 13px;}
  /* 인라인 크기·리셋보다 뒤에 오도록 강제 — 16px 미만이면 iOS가 화면을 확대한다 */
  #mcv-root input:where(:not(#mcv-rvPano *)),#mcv-root select:where(:not(#mcv-rvPano *)),#mcv-root textarea:where(:not(#mcv-rvPano *)){font-size:16px !important;}
}
@media (pointer:coarse){
  #mcv-root .mcv-seg button{min-height:36px;}
  #mcv-root .mcv-printbtn{min-height:36px;}
}
@media print{
  #mcv-root .mcv-wrap{max-width:none;padding:0;}
  #mcv-root .mcv-card{break-inside:avoid;box-shadow:none;border-color:#bbb;margin-bottom:10px;}
  #mcv-root .mcv-seg,#mcv-root .mcv-locate-btn,#mcv-root #mcv-ovSeg,#mcv-root #mcv-typeSeg,
  #mcv-root #mcv-retSeg,#mcv-root #mcv-retRangeBox,#mcv-root #mcv-diagBtn{display:none !important;}
  #mcv-root header{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #mcv-root .mcv-tables{grid-template-columns:1fr 1fr;}
  #mcv-root #mcv-map{height:380px !important;}
  #mcv-root th:where(:not(#mcv-rvPano *)){-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
#mcv-root{container-type:inline-size;box-sizing:border-box;text-align:left;font-size:16px;
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:#263238;
  background:var(--mcv-bg,#f4f6f8);padding:0;margin:0;line-height:1.6;-webkit-text-size-adjust:100%;}
#mcv-root *:where(:not(#mcv-rvPano *)),#mcv-root *:where(:not(#mcv-rvPano *)):before,#mcv-root *:where(:not(#mcv-rvPano *)):after{box-sizing:border-box;}
#mcv-root h1:where(:not(#mcv-rvPano *)),#mcv-root h2:where(:not(#mcv-rvPano *)),#mcv-root h3:where(:not(#mcv-rvPano *)),#mcv-root h4:where(:not(#mcv-rvPano *)),#mcv-root p:where(:not(#mcv-rvPano *)),#mcv-root div:where(:not(#mcv-rvPano *)),#mcv-root span:where(:not(#mcv-rvPano *)),
#mcv-root table:where(:not(#mcv-rvPano *)),#mcv-root thead:where(:not(#mcv-rvPano *)),#mcv-root tbody:where(:not(#mcv-rvPano *)),#mcv-root tfoot:where(:not(#mcv-rvPano *)),#mcv-root tr:where(:not(#mcv-rvPano *)),#mcv-root th:where(:not(#mcv-rvPano *)),#mcv-root td:where(:not(#mcv-rvPano *)),
#mcv-root label:where(:not(#mcv-rvPano *)),#mcv-root canvas:where(:not(#mcv-rvPano *)){margin:0;padding:0;border:0;background:none;float:none;
  font-family:inherit;letter-spacing:normal;text-transform:none;text-shadow:none;box-shadow:none;}
#mcv-root button:where(:not(#mcv-rvPano *)),#mcv-root select:where(:not(#mcv-rvPano *)),#mcv-root input:where(:not(#mcv-rvPano *)){font-family:inherit;font-size:100%;margin:0;
  text-transform:none;letter-spacing:normal;box-shadow:none;text-shadow:none;min-height:0;line-height:1.4;}
#mcv-root a:where(:not(#mcv-rvPano *)){text-decoration:none;}
#mcv-root table:where(:not(#mcv-rvPano *)){border-collapse:collapse;border-spacing:0;width:100%;}
#mcv-root img:where(:not(#mcv-rvPano *)),#mcv-root canvas:where(:not(#mcv-rvPano *)),#mcv-root svg:where(:not(#mcv-rvPano *)){max-width:100%;}
#mcv-root .mcv-wrap{max-width:var(--mcv-max,1240px);margin:0 auto;padding:16px;}
#mcv-root .mcv-tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));
  gap:14px;padding:16px;align-items:start;}
#mcv-root .mcv-tables>div{min-width:0;max-width:100%;overflow-x:auto;}
#mcv-root .mcv-tables table{min-width:max-content;}
#mcv-root #mcv-map{height:clamp(300px,46vh,540px);}
#mcv-root #mcv-elev{height:clamp(170px,24vh,240px);}
@container (max-width:560px){
  #mcv-root .mcv-wrap{padding:10px;}
  #mcv-root .mcv-tables{padding:10px;gap:10px;}
  #mcv-root .mcv-card>h2{padding:12px;gap:8px;}
  #mcv-root .mcv-stat{padding:7px 11px;font-size:.8rem;}
  #mcv-root table:where(:not(#mcv-rvPano *)){font-size:.8rem;} #mcv-root th:where(:not(#mcv-rvPano *)),#mcv-root td:where(:not(#mcv-rvPano *)){padding:8px;}
}
@container (min-width:1100px){ #mcv-root .mcv-tables{gap:16px;} }
@container (min-width:1420px){ #mcv-root .mcv-tables{grid-template-columns:repeat(4,minmax(0,1fr));} }
/* ═══ 삽입한 홈페이지의 CSS가 덮어써도 레이아웃이 무너지지 않도록 고정 ═══ */
#mcv-root .mcv-seg{display:inline-flex !important;visibility:visible !important;opacity:1 !important;
  float:none !important;position:static !important;width:auto !important;height:auto !important;overflow:hidden !important;}
#mcv-root .mcv-seg button{display:inline-block !important;visibility:visible !important;opacity:1 !important;
  width:auto !important;height:auto !important;min-width:0 !important;min-height:0 !important;max-width:none !important;
  float:none !important;position:static !important;text-indent:0 !important;white-space:nowrap !important;
  border-radius:0 !important;line-height:1.4 !important;}
#mcv-root .mcv-card,#mcv-root .mcv-cat,#mcv-root .mcv-item{display:block !important;visibility:visible !important;opacity:1 !important;float:none !important;}
#mcv-root .mcv-card>h2{display:flex !important;flex-wrap:wrap !important;align-items:center !important;}
#mcv-root .mcv-cat-h,#mcv-root .mcv-chips,#mcv-root .mcv-stats,#mcv-root .mcv-cat-f{display:flex !important;flex-wrap:wrap !important;}
#mcv-root .mcv-tables{display:grid !important;}
#mcv-root #mcv-map{display:block !important;width:100% !important;min-height:280px !important;}
#mcv-root #mcv-mapWrap{position:relative !important;display:block !important;}
#mcv-root .mcv-c{display:inline-block !important;}
#mcv-root header,#mcv-root .mcv-wrap{display:block !important;visibility:visible !important;}
#mcv-root .mcv-pop{min-width:180px;max-width:280px;}
#mcv-root .mcv-pop-h{display:flex !important;align-items:center;gap:8px;margin-bottom:8px;}
#mcv-root .mcv-pop-t{display:flex;flex-direction:column;min-width:0;}
#mcv-root .mcv-pop-t b{font-size:.92rem;font-weight:700;color:#263238;line-height:1.35;}
#mcv-root .mcv-pop-t i{font-style:normal;font-size:.72rem;color:#78909c;}
#mcv-root .mcv-pop .mcv-chips{gap:5px;}
#mcv-root .mcv-pop .mcv-memo{margin-top:7px;padding-top:7px;border-top:1px solid #eef1f4;}

/* ═══ 지도 내부는 SDK 계산값을 그대로 둔다. 단, 우리가 만든 mcv- 요소는 예외에서 제외 ═══ */
#mcv-root #mcv-map *:not([class*="mcv-"]){box-sizing:content-box;max-width:none;max-height:none;}
#mcv-root #mcv-map div:not([class*="mcv-"]),#mcv-root #mcv-map span:not([class*="mcv-"]),
#mcv-root #mcv-map canvas,#mcv-root #mcv-map img,#mcv-root #mcv-map svg,
#mcv-root #mcv-map p:not([class*="mcv-"]),#mcv-root #mcv-map table,#mcv-root #mcv-map tr,
#mcv-root #mcv-map td,#mcv-root #mcv-map a:not([class*="mcv-"]){
  margin:revert;padding:revert;border:revert;background:revert;box-shadow:revert;
  float:none;position:revert;line-height:normal;font-size:revert;}
#mcv-root #mcv-map img{max-width:none !important;height:auto;}

/* ═══ 지도 위 우리 오버레이 — 지도 안이라도 카드 스타일을 유지 ═══ */
#mcv-root #mcv-map .mcv-kinfo{position:relative;background:rgba(255,255,255,.75);border:1px solid rgba(176,190,197,.75);
  border-radius:14px;padding:16px 38px 16px 18px;box-shadow:0 10px 30px rgba(38,50,56,.26);white-space:normal;
  font-size:.83rem;line-height:1.6;color:#263238;max-width:320px;
  -webkit-backdrop-filter:blur(10px) saturate(1.25);backdrop-filter:blur(10px) saturate(1.25);}
#mcv-root #mcv-map .mcv-kinfo:after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-9px;
  border:9px solid transparent;border-top-color:rgba(255,255,255,.75);border-bottom:0;}
#mcv-root #mcv-map .mcv-kinfo .mcv-x{position:absolute;top:9px;right:11px;cursor:pointer;color:#90a4ae;
  font-size:16px;font-weight:700;line-height:1;background:none;border:0;padding:2px 4px;border-radius:6px;}
#mcv-root #mcv-map .mcv-kinfo .mcv-x:hover{background:rgba(96,125,139,.12);color:#546e7a;}
#mcv-root #mcv-map .mcv-pop{min-width:186px;}
#mcv-root #mcv-map .mcv-pop-h{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
#mcv-root #mcv-map .mcv-pop-t{display:flex;flex-direction:column;min-width:0;}
#mcv-root #mcv-map .mcv-pop-t b{font-size:.92rem;font-weight:700;color:#263238;line-height:1.35;}
#mcv-root #mcv-map .mcv-pop-t i{font-style:normal;font-size:.72rem;color:#78909c;}
#mcv-root #mcv-map .mcv-chips{display:flex;flex-wrap:wrap;gap:7px;}

/* ══════════════ Apple Reference Design System 준수 (기본 규칙 위에 덮어쓴다)
   · 인터랙티브 색은 Action Blue 하나  · UI 그림자 금지
   · 라디우스 0/5/8/11/18/pill        · weight 500 금지
   · 본문 17px / 1.47 / -0.374px      · 장식 그라디언트 금지            */
#mcv-root{
  --blue:#0071e3; --link:#0066cc; --link-dark:#2997ff;
  --dark:#1d1d1f; --bg:#f5f5f7; --card:#ffffff; --pearl:#fafafc;
  --line:rgba(0,0,0,.08); --line2:#e0e0e0; --divider:#f0f0f0;
  --muted:#6e6e73; --sub:#515154; --dim:#7a7a7a;
  --r:18px; --r-md:11px; --r-sm:8px; --r-xs:5px; --pill:9999px;
  --ease:cubic-bezier(.28,.11,.32,1);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,
    'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:17px; line-height:1.47; letter-spacing:-.374px;
}
/* 발행 코스도는 보는 사람의 다크모드를 따라가지 않는다 — 언제나 밝은 면.
   참가자·스탭이 제각각인 기기로 열고, 인쇄·캡처해서 돌려 보는 문서이기 때문이다.
   (다크모드를 따라가던 때 실측: 제한시간 제목 1.06:1 · 표 내용 1.60:1 — 사실상 안 보였다) */
#mcv-root{ color-scheme:light; }
/* 진행 방향 화살표 */
#mcv-root .mcv-arrow{display:flex;align-items:center;justify-content:center;pointer-events:none;line-height:0;}
#mcv-root .mcv-arrow svg{display:block;}
/* 전 코스 보기 */
#mcv-root .mcv-allBtn{border:1px solid var(--line);background:#fff;color:var(--dark);
  border-radius:999px;padding:7px 15px;font-size:.8rem;font-weight:600;cursor:pointer;
  white-space:nowrap;letter-spacing:-.2px;
  transition:background .18s ease, border-color .18s ease, color .18s ease, transform .12s ease;}
#mcv-root .mcv-allBtn:hover{background:var(--pearl);}
#mcv-root .mcv-allBtn:active{transform:scale(.95);}
#mcv-root .mcv-allBtn.mcv-on{background:#0071e3;border-color:#0071e3;color:#fff;}
#mcv-root .mcv-allNote{display:none;align-items:center;gap:8px;flex-wrap:wrap;
  padding:9px 14px;margin:0 0 2px;background:var(--pearl);border-radius:12px;
  font-size:.78rem;color:var(--sub);line-height:1.5;}
#mcv-root .mcv-allNote.mcv-on{display:flex;}
#mcv-root .mcv-allNote i{display:inline-block;width:18px;height:4px;border-radius:2px;flex:none;}
#mcv-root #mcv-laneNote .mcv-lk{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
#mcv-root #mcv-laneNote .mcv-lk svg{display:block;flex:none;}
#mcv-root #mcv-laneNote .mcv-rn{display:inline-block;font-weight:800;font-size:13px;}
#mcv-root .mcv-allChip{display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;
  font-size:.78rem;color:var(--sub);font-family:inherit;
  transition:border-color .18s ease, background .18s ease, transform .12s ease;}
#mcv-root .mcv-allChip:hover{background:var(--pearl);}
#mcv-root .mcv-allChip:active{transform:scale(.95);}
#mcv-root .mcv-allChip.mcv-on{border-color:#0071e3;color:var(--dark);}
#mcv-root .mcv-allChip b{font-weight:700;color:#0071e3;}
#mcv-root .mcv-allNote b{color:var(--dark);font-weight:700;}
#mcv-root .mcv-wrap{max-width:1120px;padding:24px 20px 48px;}
/* 헤더 — 색 띠·그라디언트 없이 타이포로만 */
#mcv-root header,#mcv-root header.admin{
  background:var(--card);color:var(--dark);border:1px solid var(--line2);
  border-radius:var(--r);padding:32px;margin-bottom:24px;box-shadow:none;}
#mcv-root header h1{font-size:40px;font-weight:600;line-height:1.1;letter-spacing:0;margin-bottom:10px;}
#mcv-root header p{opacity:1;color:var(--muted);font-size:17px;line-height:1.47;letter-spacing:-.374px;}
#mcv-root header .mcv-tag{background:var(--divider);color:var(--sub);font-weight:600;
  font-size:14px;letter-spacing:-.224px;padding:4px 12px;border-radius:var(--pill);}
#mcv-root header.admin .mcv-tag{background:var(--dark);color:var(--card);}
#mcv-root .mcv-stats{gap:8px;margin-top:24px;}
#mcv-root .mcv-stat{background:var(--bg);border-radius:var(--r-md);padding:10px 16px;
  font-size:12px;color:var(--muted);letter-spacing:0;}
#mcv-root .mcv-stat b{font-size:21px;font-weight:600;line-height:1.19;letter-spacing:-.231px;
  color:var(--dark);margin-top:3px;}
#mcv-root .mcv-kakao-open{border-radius:var(--pill);padding:11px 22px;font-weight:400;
  font-size:17px;letter-spacing:-.374px;}
/* 카드 — 흰 면 · 1px 헤어라인 · 18px · 그림자 없음 */
#mcv-root .mcv-card{border-radius:var(--r);border:1px solid var(--line2);box-shadow:none;margin-bottom:24px;}
#mcv-root .mcv-card h2{font-size:17px;font-weight:600;line-height:1.24;letter-spacing:-.374px;padding:17px 24px;}
/* 세그먼트 — configurator chip (알약 · 선택 시 2px Action Blue) */
#mcv-root .mcv-seg{border:none;background:transparent;border-radius:0;overflow:visible;
  display:inline-flex;gap:6px;flex-wrap:wrap;}
#mcv-root .mcv-seg button{background:var(--card);border:1px solid var(--line2);border-radius:var(--pill);
  padding:7px 15px;color:var(--dark);font-size:14px;font-weight:400;letter-spacing:-.224px;
  transition:border-color .18s var(--ease), background .18s var(--ease), transform .12s var(--ease);}
#mcv-root .mcv-seg button:not(:last-child){border-right:1px solid var(--line2);}
#mcv-root .mcv-seg button:hover{background:var(--bg);}
#mcv-root .mcv-seg button:active{transform:scale(.95);}
#mcv-root .mcv-seg button.mcv-on,
#mcv-root .mcv-seg.mcv-course button.mcv-on,
#mcv-root .mcv-seg.mcv-kk button.mcv-on{background:var(--card);color:var(--dark);
  border:2px solid var(--blue);padding:6px 14px;font-weight:600;box-shadow:none;}
/* 지도 */
#mcv-root #mcv-map{height:600px;background:var(--bg);}
#mcv-root #mcv-mapErr{background:color-mix(in srgb, var(--card) 90%, transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);}
#mcv-root #mcv-mapErr .mcv-in{color:var(--muted);font-size:17px;line-height:1.47;}
#mcv-root #mcv-mapErr code{background:var(--divider);border-radius:var(--r-xs);}
/* 칩 · 범례 */
#mcv-root .mcv-chip{background:var(--card);border:1px solid var(--line2);border-radius:var(--pill);
  padding:6px 14px;color:var(--dark);cursor:pointer;font-size:14px;letter-spacing:-.224px;
  transition:border-color .18s var(--ease), background .18s var(--ease);}
#mcv-root .mcv-chip:hover{background:var(--bg);}
#mcv-root .mcv-chip-off{opacity:.4;border-style:dashed;}
#mcv-root .mcv-sumchip{background:var(--bg);border-radius:var(--r-md);border:none;}
/* 표 */
#mcv-root table:where(:not(#mcv-rvPano *)){font-size:14px;letter-spacing:-.224px;}
#mcv-root th:where(:not(#mcv-rvPano *)){background:var(--bg);color:var(--muted);font-weight:600;font-size:12px;letter-spacing:0;
  border-bottom:1px solid var(--line);padding:11px 14px;}
#mcv-root td:where(:not(#mcv-rvPano *)){border-bottom:1px solid var(--line);padding:10px 14px;color:var(--dark);}
#mcv-root tbody:where(:not(#mcv-rvPano *)) tr:hover td{background:var(--bg);}
#mcv-root tfoot:where(:not(#mcv-rvPano *)) td{background:var(--bg);font-weight:600;}
#mcv-root .mcv-titleicon{border-radius:var(--r-sm);}
/* 항목 카드 (참가자용) */
#mcv-root .mcv-item{border-radius:var(--r-md);border:1px solid var(--line2);box-shadow:none;
  transition:border-color .18s var(--ease), background .18s var(--ease);}
#mcv-root .mcv-item:hover{background:var(--bg);}
#mcv-root .mcv-nm{font-size:17px;font-weight:600;letter-spacing:-.374px;}
#mcv-root .mcv-c{border-radius:var(--pill);font-weight:600;font-size:14px;letter-spacing:-.224px;}
#mcv-root .mcv-memo,#mcv-root .mcv-note,#mcv-root .mcv-ops{color:var(--muted);font-size:14px;letter-spacing:-.224px;}
/* 지도 마커 — 지도 위 요소는 translucent chip 문법 */
#mcv-root .mcv-kstart{border-radius:var(--pill);padding:4px 12px;font-weight:600;
  background:#1d6f42;box-shadow:none;letter-spacing:0;}
#mcv-root .mcv-kturn{border-radius:var(--pill);padding:4px 12px;font-weight:600;
  background:#c2600a;box-shadow:none;letter-spacing:0;}
#mcv-root .mcv-kpoi{border:2px solid #fff;box-shadow:none;}
/* ── 시설 정보 카드 — 지도 가운데, 카드 한 장, 불투명 ──
   앞서 세 군데에서 .mcv-kinfo 와 .mcv-pop 에 각각 배경을 칠해 카드가 두 겹으로 보였고,
   rgba(255,255,255,.75) + blur 라 뒤 지도가 비쳐 글자가 읽히지 않았다. 여기서 정리한다. */
#mcv-root .mcv-infoLayer{position:absolute;inset:0;z-index:950;
  display:flex;align-items:center;justify-content:center;padding:16px;}
#mcv-root .mcv-infoScrim{position:absolute;inset:0;background:rgba(0,0,0,.32);
  animation:mcvFade .18s ease both;}
#mcv-root .mcv-kinfo,
#mcv-root #mcv-map .mcv-kinfo{
  position:relative;white-space:normal;
  background:var(--card) !important;                 /* 불투명 — 뒤 지도가 비치지 않는다 */
  border:1px solid var(--line2) !important;
  border-radius:var(--r) !important;
  box-shadow:rgba(0,0,0,.22) 0 8px 40px 0 !important;
  backdrop-filter:none !important;-webkit-backdrop-filter:none !important;
  padding:20px 20px 18px !important;

/* ══════════════════════════════════════════════════════════════════════════════
   겹침·차선 엔진 — 같은 길을 여러 번 지나는 코스를 '나란한 차선' 으로 그리기 위한 계산.
   제작기와 발행본(뷰어 틀)에 같은 글이 두 번 들어 있다. 한쪽만 고치면 지도와 발행본이
   서로 다르게 그려지므로, 고칠 때는 두 사본을 함께 고칠 것 (test/lane-engine.js 가 원본).

   왜 이렇게 하는가 —
   · 경로 서버·그리기 도구가 만든 GPX 는 점 간격이 2~70m 로 들쑥날쑥하다. 점끼리의 거리로
     '같은 자리' 를 재면 간격이 벌어진 곳마다 겹침 판정이 깜빡여 차선이 서로 가로질렀다.
     → 코스를 STEP m 간격으로 잘게 나눈 사본 위에서, 점과 '앞서 지난 토막(선분)' 의 거리로 잰다.
   · 왕복의 갈 때 선과 올 때 선은 몇 m 씩 어긋난 채 그려져 있다. 각자 제 선에서 밀면 두 차선이
     나란하지 않고 어디서는 벌어지고 어디서는 꼬인다.
     → 두 번째 이후 통과는 첫 통과의 선 위로 옮겨 놓고(snap) 그 선의 법선으로 민다.
   ══════════════════════════════════════════════════════════════════════════════ */
function makeLaneEngine(){
  const RAD=Math.PI/180;
  const R=26;          /* 이 안이면 같은 자리 */
  const MINARC=220;    /* 코스 거리로 이만큼 떨어진 통과만 별개로 */
  const SEAM=260;      /* 순환 코스 출발↔도착 이음매 */
  const STEP=10;       /* 잘게 나눈 사본의 점 간격(m) */
  const MAXN=14000;    /* 사본 최대 점 수 (초장거리 대비) */
  const MINRUN=60;     /* 이보다 짧은 회차 토막은 이웃에 흡수 */
  const BLEND=60;      /* 옮겨 붙인 선에서 원래 자리로 돌아오는(또는 그 반대) 거리 — 완만하게(smoothstep) */

  function metric(pts){
    const lat0=pts[Math.floor(pts.length/2)][0];
    return {kx:111320*Math.cos(lat0*RAD)||1, ky:110540};
  }
  /* 교차로에서 경로 서버가 만드는 짧은 되돌이(몇 m 나갔다 돌아오는 가시)를 접는다 — 점 개수는 그대로 */
  function despur(pts){
    const n=pts.length; if(n<4) return pts;
    const SPUR=45, RET=8, {kx,ky}=metric(pts);
    const d=(a,b)=>Math.hypot((a[1]-b[1])*kx,(a[0]-b[0])*ky);
    const out=pts.map(p=>p);
    let i=0;
    while(i<n-2){
      let found=-1, len=0;
      for(let j=i+2;j<Math.min(n,i+14);j++){
        len+=d(pts[j-1],pts[j]); if(len>SPUR*2) break;
        if(d(pts[i],pts[j])<RET){ found=j; break; }
      }
      if(found>0){
        let far=0; for(let k=i+1;k<found;k++) far=Math.max(far, d(pts[i],pts[k]));
        /* 되돌아온 뒤 계속 같은 쪽으로 가야 가시다 — 왔던 길로 되돌아가면 반환점(∪) 이지 가시가 아니다 */
        const a=pts[Math.max(0,i-2)], b=pts[Math.min(n-1,found+2)];
        const ux=(pts[i][1]-a[1])*kx, uy=(pts[i][0]-a[0])*ky, vx=(b[1]-pts[found][1])*kx, vy=(b[0]-pts[found][0])*ky;
        const uturn = (ux*vx+uy*vy) < -0.3*Math.hypot(ux,uy)*Math.hypot(vx,vy);
        if(!uturn && far>=3 && far<=SPUR){ for(let k=i+1;k<found;k++) out[k]=[pts[i][0],pts[i][1]]; i=found; continue; }
      }
      i++;
    }
    return out;
  }
  /* STEP m 간격 사본 — 원래 점은 모두 남기고 사이를 채운다. cum 은 원래 누적거리를 그대로 나눠 가진다 */
  function densify(pts, cum){
    const n=pts.length, total=cum[n-1];
    const step=Math.max(STEP, total/MAXN), {kx:kx0,ky:ky0}=metric(pts);
    const P=[], C=[], orig=new Int32Array(n);
    for(let i=0;i<n;i++){
      if(i>0){
        const L=cum[i]-cum[i-1], k=Math.floor(L/step);
        for(let s=1;s<=k;s++){
          const t=s*step/L; if(t>=1-1e-9) break;
          P.push([pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t]);
          C.push(cum[i-1]+L*t);
        }
      }
      /* 출발선에 서 있던 GPX 는 같은 자리에 점이 수천 개다 — 앞 점 1.5m 안의 점은 대표 하나로 (색인은 대표를 가리킨다).
         마지막 점은 남긴다 (도착 표시 자리) */
      if(i>0 && i<n-1 && P.length){
        const q=P[P.length-1];
        if(Math.hypot((pts[i][1]-q[1])*kx0,(pts[i][0]-q[0])*ky0)<1.5){ orig[i]=P.length-1; continue; }
      }
      orig[i]=P.length; P.push([pts[i][0],pts[i][1]]); C.push(cum[i]);
    }
    const m=P.length, {kx,ky}=metric(pts);
    const X=new Float64Array(m), Y=new Float64Array(m);
    for(let i=0;i<m;i++){ X[i]=P[i][1]*kx; Y[i]=P[i][0]*ky; }
    return {pts:P, cum:Float64Array.from(C), orig, X, Y, kx, ky, n:m};
  }
  /* 앞뒤 2점(사본에서 약 40m) 으로 진행 방향 */
  function dirs(X,Y){
    const n=X.length, DX=new Float32Array(n), DY=new Float32Array(n);
    for(let i=0;i<n;i++){
      const a=Math.max(0,i-2), b=Math.min(n-1,i+2);
      const dx=X[b]-X[a], dy=Y[b]-Y[a], L=Math.hypot(dx,dy);
      if(L>=3){ DX[i]=dx/L; DY[i]=dy/L; }
    }
    return {DX,DY};
  }
  /* 선분 격자 — 토막 j(j→j+1) 를 그 상자가 닿는 칸마다 넣는다 */
  function segGrid(){
    const g=new Map();
    return {
      add(j,x0,y0,x1,y1){
        if(Math.hypot(x1-x0,y1-y0)<0.3) return;
        const ax=Math.floor(Math.min(x0,x1)/R), bx=Math.floor(Math.max(x0,x1)/R);
        const ay=Math.floor(Math.min(y0,y1)/R), by=Math.floor(Math.max(y0,y1)/R);
        for(let a=ax;a<=bx;a++) for(let b=ay;b<=by;b++){
          const k=a+'|'+b; let arr=g.get(k); if(!arr){ arr=[]; g.set(k,arr); }
          if(arr.length<900) arr.push(j);
        }
      },
      near(x,y,fn){
        const gx=Math.floor(x/R), gy=Math.floor(y/R);
        for(let a=gx-1;a<=gx+1;a++) for(let b=gy-1;b<=gy+1;b++){
          const arr=g.get(a+'|'+b); if(!arr) continue;
          for(let q=0;q<arr.length;q++) fn(arr[q]);
        }
      }
    };
  }
  /* 점 (x,y) 를 토막 (x0,y0)-(x1,y1) 에 내린 자리 */
  function proj(x,y,x0,y0,x1,y1){
    const vx=x1-x0, vy=y1-y0, L2=vx*vx+vy*vy;
    let t=L2>0 ? ((x-x0)*vx+(y-y0)*vy)/L2 : 0; t=t<0?0:(t>1?1:t);
    const qx=x0+vx*t, qy=y0+vy*t;
    return {t, qx, qy, d:Math.hypot(x-qx,y-qy)};
  }
  /* 사본의 점마다 '앞서 몇 번 지난 자리인가' — 앞서 지난 토막과의 거리로 */
  function passIndex(D){
    const {X,Y,cum,n}=D, {DX,DY}=dirs(X,Y);
    const pass=new Int16Array(n), same=new Int16Array(n), total=cum[n-1];
    const closed=Math.hypot(X[n-1]-X[0], Y[n-1]-Y[0])<130;
    const grid=segGrid(), hits=[];
    const SX=new Float32Array(n), SY=new Float32Array(n);
    for(let j=0;j<n-1;j++){ const dx=X[j+1]-X[j], dy=Y[j+1]-Y[j], L=Math.hypot(dx,dy); if(L>0){ SX[j]=dx/L; SY[j]=dy/L; } }
    for(let i=0;i<n;i++){
      hits.length=0;
      const dxi=DX[i], dyi=DY[i];
      grid.near(X[i],Y[i], j=>{
        const p=proj(X[i],Y[i],X[j],Y[j],X[j+1],Y[j+1]); if(p.d>R) return;
        const arc=cum[j]+(cum[j+1]-cum[j])*p.t;
        const dot=dxi*SX[j]+dyi*SY[j];
        const opp = dot < -0.7 && (dxi||dyi);            /* 되돌아오는 방향(135° 넘게) 만 '반대' */
        if(cum[i]-arc < MINARC && !opp) return;          /* 같은 길을 그대로 오는 중 */
        if(closed && arc < SEAM && cum[i] > total-SEAM && !opp) return;   /* 출발↔도착 이음매 */
        hits.push({arc, sx:SX[j], sy:SY[j]});
      });
      let runs=0, sm=0;
      if(hits.length){
        hits.sort((a,b)=>a.arc-b.arc); runs=1;
        const sameDir=h=>(dxi*h.sx+dyi*h.sy)>0;
        if(sameDir(hits[0])) sm=1;
        for(let k=1;k<hits.length;k++){
          const h=hits[k], g=hits[k-1];
          if(h.arc-g.arc > MINARC || h.sx*g.sx+h.sy*g.sy < -0.7){ runs++; if(sameDir(h)) sm++; }
        }
      }
      pass[i]=runs; same[i]=sm;
      if(i>0) grid.add(i-1, X[i-1],Y[i-1],X[i],Y[i]);
    }
    pass.same=same;
    return pass;
  }
  /* 회차가 같은 토막끼리 묶고, 짧은 토막은 더 긴 이웃에 흡수 */
  function runsOf(pass, cum, minLen){
    const n=pass.length, L=minLen||MINRUN, runs=[];
    let a=0;
    for(let i=1;i<=n;i++) if(i===n || pass[i]!==pass[a]){ runs.push({i0:a, i1:i-1, pass:pass[a]}); a=i; }
    const len=r=>cum[r.i1]-cum[r.i0];
    let guard=0;
    while(runs.length>1 && guard++ < 8000){
      let k=-1, best=Infinity;
      for(let i=0;i<runs.length;i++){ const v=len(runs[i]); if(v<L && v<best){ best=v; k=i; } }
      if(k<0) break;
      const prev = k>0 ? runs[k-1] : null, next = k<runs.length-1 ? runs[k+1] : null;
      if(prev && (!next || len(prev)>=len(next))) prev.i1=runs[k].i1;
      else next.i0=runs[k].i0;
      runs.splice(k,1);
      for(let i=1;i<runs.length;i++)
        if(runs[i].pass===runs[i-1].pass){ runs[i-1].i1=runs[i].i1; runs.splice(i,1); i--; }
    }
    return runs;
  }
  /* 코스 하나의 겹침 모형 — pts/cum 은 원래 점, 나머지는 사본 기준 */
  function build(pts, cum){
    if(!pts || pts.length<3 || !cum || cum.length!==pts.length) return null;
    const D=densify(despur(pts), cum);
    const raw=passIndex(D);
    const runsD=runsOf(raw, D.cum);
    /* 같은 회차 두 토막 사이에 낀 짧은 낮은 회차(400m 안, 앞선 통과의 선에서 60m 안) — 갈 때와 올 때가 잠깐
       30m 넘게 벌어진 것(다리·굴다리·건너편 길)이다. 그대로 두면 그 자리에서 차선이 서로 가로지른다 → 이웃 회차로 이어 붙인다 */
    {
      const {X,Y,cum:C,n}=D, CELL=60, pg=new Map();
      for(let i=0;i<n;i++){ const k=Math.floor(X[i]/CELL)+'|'+Math.floor(Y[i]/CELL); let a=pg.get(k); if(!a){ a=[]; pg.set(k,a); } a.push(i); }
      const passAt=new Int16Array(n);
      const refresh=()=>runsD.forEach(r=>{ for(let i=r.i0;i<=r.i1;i++) passAt[i]=r.pass; });
      const nearLower=(i,p,maxD)=>{
        const gx=Math.floor(X[i]/CELL), gy=Math.floor(Y[i]/CELL); let best=Infinity;
        for(let a=gx-1;a<=gx+1;a++) for(let b=gy-1;b<=gy+1;b++){ const arr=pg.get(a+'|'+b); if(!arr) continue;
          for(let q=0;q<arr.length;q++){ const j=arr[q]; if(j>=i || C[i]-C[j]<MINARC || passAt[j]>=p) continue;
            const d=Math.hypot(X[i]-X[j],Y[i]-Y[j]); if(d<best) best=d; } }
        return best<=maxD;
      };
      for(let guard=0; guard<200; guard++){
        refresh();
        let k=-1;
        for(let i=1;i<runsD.length-1;i++){
          const r=runsD[i], p=runsD[i-1].pass;
          if(!(p>r.pass && runsD[i+1].pass===p && C[r.i1]-C[r.i0] < 400)) continue;
          let ok=true; for(let j=r.i0;j<=r.i1;j+=2) if(!nearLower(j,p,60)){ ok=false; break; }
          if(ok){ k=i; break; }
        }
        if(k<0) break;
        runsD[k-1].i1=runsD[k+1].i1; runsD.splice(k,2);
      }
    }
    /* 반환점: 회차가 바뀌는 자리에서 진행 방향이 뒤집히면, 경계를 실제 꼭짓점(가장 멀리 나간 점)으로 옮긴다.
       거기서는 민 폭을 부드럽게 잇지 않고 바로 다음 차선으로 건너간다 — 그래야 ∪ 모양이 된다 */
    {
      const {X,Y,n}=D, {DX,DY}=dirs(X,Y);
      for(let k=1;k<runsD.length;k++){
        /* 방향은 경계에서 넉넉히(8점 ≈ 80m) 떨어진 곳에서 잰다 — 경계 바로 옆은 꼭짓점을 걸쳐 방향이 0 이 된다 */
        const b=runsD[k].i0, p=Math.max(runsD[k-1].i0, b-8), q=Math.min(runsD[k].i1, b+8);
        const dot=DX[p]*DX[q]+DY[p]*DY[q];
        /* 거의 정반대(150° 넘게) 로 돌아서고, 앞뒤 80m 지점이 같은 길 위(40m 안) 여야 반환점 — 갈림길의 급한 꺾임은 아니다 */
        if(!(DX[p]||DY[p]) || !(DX[q]||DY[q]) || dot > -0.85 || Math.hypot(X[p]-X[q],Y[p]-Y[q]) > 55) continue;
        const lo=Math.max(runsD[k-1].i0+1, b-10), hi=Math.min(runsD[k].i1-1, b+10);
        let c=b, best=-Infinity;
        for(let i=lo;i<=hi;i++){ const v=X[i]*DX[p]+Y[i]*DY[p]; if(v>best){ best=v; c=i; } }
        runsD[k-1].i1=c; runsD[k].i0=c+1; runsD[k].turnIn=true; runsD[k-1].turnOut=true;
      }
    }
    const clean=new Int16Array(D.n);
    runsD.forEach(r=>{ for(let i=r.i0;i<=r.i1;i++) clean[i]=r.pass; });
    let max=0; for(let i=0;i<D.n;i++) if(clean[i]>max) max=clean[i];
    /* 원래 점 기준 회차 (딱지·범례 등 옛 소비자용) */
    const n=pts.length, passOrig=new Int16Array(n);
    for(let i=0;i<n;i++) passOrig[i]=clean[D.orig[i]];
    /* 원래 점 색인으로도 알려 주되, 정확한 자리는 m0/m1 (m 단위) 이다 */
    let oi=0;
    const runs=runsD.map(r=>{
      while(oi<n-1 && D.orig[oi+1]<=r.i0) oi++;
      let i1=oi; while(i1<n-1 && D.orig[i1+1]<=r.i1) i1++;
      return {pass:r.pass, i0:oi, i1, m0:D.cum[r.i0], m1:D.cum[r.i1], m1x:D.cum[Math.min(r.i1+1, D.n-1)], d0:r.i0, d1:r.i1, turnIn:!!r.turnIn, turnOut:!!r.turnOut};
    });
    return {D, clean, runs, passOrig, max, same:raw.same};
  }
  /* 두 번째 이후 통과를 첫 통과의 선 위로 옮긴다 (사본 좌표, m).
     토막(회차 구간) 단위로: ① 점마다 앞선 통과의 가장 가까운 선분에 내리고 ② 못 내린 사이 점은
     앞뒤로 내린 자리 사이를 그 선을 따라 채우고 ③ 이웃 점이 다른 선분에 내렸으면 그 사이 꼭짓점(모퉁이)을 지나게 하고
     ④ 구간 들머리·날머리 BLEND m 는 원래 자리와 섞어 튀지 않게 한다 (반환점 쪽은 바로 붙인다) */
  function snapLater(model){
    const {D, clean, runs}=model, {X,Y,cum,n}=D;
    const BX=Float64Array.from(X), BY=Float64Array.from(Y);
    const {DX,DY}=dirs(X,Y);
    const grid=segGrid();
    const addRun=r=>{ for(let i=Math.max(1,r.d0);i<=r.d1;i++) grid.add(i-1, BX[i-1],BY[i-1],BX[i],BY[i]); if(r.d1<n-1) grid.add(r.d1, BX[r.d1],BY[r.d1],BX[r.d1+1],BY[r.d1+1]); };
    const SJ=new Int32Array(n).fill(-1), ST=new Float64Array(n), PX=new Float64Array(n), PY=new Float64Array(n);
    const dvX=new Float64Array(n), dvY=new Float64Array(n), def=new Uint8Array(n), SG=new Int8Array(n);
    let lastDef=-1;
    /* a 와 b 사이(둘 다 옮긴 점, 또는 -1/n) 의 옮기지 않은 점들: 가까우면(2·BLEND 안) 두 옮김을 잇고, 멀면 각각 BLEND 안에서 0 으로 거둔다 */
    const resolve=(a,b)=>{
      const L=(a>=0 && b<n) ? cum[b]-cum[a] : Infinity;
      for(let i=a+1;i<b;i++){
        let dx=0, dy=0;
        const ss=t=>{ t=Math.max(0,Math.min(1,t)); return t*t*(3-2*t); };     /* 급히 꺾이지 않게 */
        if(L<=2*BLEND){ const f=ss((cum[i]-cum[a])/L); dx=dvX[a]*(1-f)+dvX[b]*f; dy=dvY[a]*(1-f)+dvY[b]*f; }
        else {
          if(a>=0){ const g=1-ss((cum[i]-cum[a])/BLEND); dx+=dvX[a]*g; dy+=dvY[a]*g; }
          if(b<n){ const g=1-ss((cum[b]-cum[i])/BLEND); dx+=dvX[b]*g; dy+=dvY[b]*g; }
        }
        BX[i]=X[i]+dx; BY[i]=Y[i]+dy;
      }
    };
    runs.forEach(r=>{
      const p=r.pass;
      if(!(p>0)){ for(let i=r.d0;i<=r.d1;i++) SG[i]=1; addRun(r); return; }
      let prevSeg=-1;
      for(let i=r.d0;i<=r.d1;i++){
        let best=null, bs=Infinity;
        const dxi=DX[i], dyi=DY[i];
        grid.near(X[i],Y[i], j=>{
          if(j+1>=i) return;
          if(Math.min(clean[j],clean[j+1]) >= p) return;            /* 나보다 앞선 통과의 토막만 */
          const sx=BX[j+1]-BX[j], sy=BY[j+1]-BY[j], L=Math.hypot(sx,sy); if(L<0.3) return;
          const dot=(dxi*sx+dyi*sy)/L;
          if(cum[i]-cum[j+1] < MINARC && dot > -0.7) return;         /* 제 길 */

const canvas=document.getElementById('mcv-elev'), ctx=canvas.getContext('2d'), tooltip=document.getElementById('mcv-tooltip');
const PAD={l:46,r:14,t:14,b:26};
function eleAtKm(km){
  const P=C.profile;
  let i=0; while(i<P.length-1&&P[i+1][0]<km) i++;
  const [k0,e0]=P[i],[k1,e1]=P[Math.min(i+1,P.length-1)];
  const t=k1>k0?(km-k0)/(k1-k0):0;
  return e0+t*(e1-e0);
}
function drawChart(hoverX){
  const P=C.profile,total=C.total_km;
  const dpr=window.devicePixelRatio||1,W=canvas.clientWidth,H=canvas.clientHeight;
  canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(!C.hasEle){ ctx.fillStyle='#90a4ae'; ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.fillText('고도 정보가 없는 코스입니다',W/2,H/2); return null; }
  let eMin=Math.floor(C.ele_min/10)*10, eMax=Math.ceil(C.ele_max/10)*10+10;
  if(eMax-eMin<30) eMax=eMin+30;
  const iw=W-PAD.l-PAD.r, ih=H-PAD.t-PAD.b;
  const x=km=>PAD.l+iw*km/total, y=e=>PAD.t+ih*(1-(e-eMin)/(eMax-eMin));
  const eStep=(eMax-eMin)>120?50:((eMax-eMin)>60?25:10);
  ctx.font='10px sans-serif'; ctx.fillStyle='#90a4ae'; ctx.strokeStyle='#eceff1'; ctx.lineWidth=1;
  for(let e=eMin;e<=eMax;e+=eStep){
    ctx.beginPath();ctx.moveTo(PAD.l,y(e));ctx.lineTo(W-PAD.r,y(e));ctx.stroke();
    ctx.textAlign='right';ctx.fillText(e+'m',PAD.l-6,y(e)+3);
  }
  const kStep=total>25?5:(total>8?2:1);
  for(let k=0;k<=total;k+=kStep){
    ctx.beginPath();ctx.moveTo(x(k),PAD.t);ctx.lineTo(x(k),H-PAD.b);ctx.stroke();
    ctx.textAlign='center';ctx.fillText(k+'km',x(k),H-8);
  }
  const tk=turnOf(C);
  if(tk!=null){
    ctx.beginPath();ctx.moveTo(x(tk),PAD.t);ctx.lineTo(x(tk),H-PAD.b);
    ctx.strokeStyle='#f57c00';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#ef6c00';ctx.textAlign='center';ctx.font='bold 10px sans-serif';
    ctx.fillText('↩ '+((C.turnNames&&C.turnNames[0])?String(C.turnNames[0]).slice(0,12):'반환'),x(tk),PAD.t+10); ctx.font='10px sans-serif';
  }
  const grad=ctx.createLinearGradient(0,PAD.t,0,H-PAD.b);
  grad.addColorStop(0,'rgba(25,118,210,.45)');grad.addColorStop(1,'rgba(25,118,210,.05)');
  ctx.beginPath(); ctx.moveTo(x(P[0][0]),y(P[0][1]));
  for(const [k,e] of P) ctx.lineTo(x(k),y(e));
  ctx.lineTo(x(P[P.length-1][0]),H-PAD.b); ctx.lineTo(x(P[0][0]),H-PAD.b); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x(P[0][0]),y(P[0][1]));
  for(const [k,e] of P) ctx.lineTo(x(k),y(e));
  ctx.strokeStyle='#1565c0'; ctx.lineWidth=2; ctx.stroke();
  C.pois.forEach(p=>passInfo(p).forEach(r=>{
    ctx.beginPath(); ctx.arc(x(r.km),y(eleAtKm(r.km)),4,0,7);
    ctx.fillStyle=CAT[p.cat].color; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
  }));
  if(hoverX!=null&&hoverX>=PAD.l&&hoverX<=W-PAD.r){
    const km=(hoverX-PAD.l)/iw*total, ele=eleAtKm(km);
    ctx.beginPath();ctx.moveTo(hoverX,PAD.t);ctx.lineTo(hoverX,H-PAD.b);
    ctx.strokeStyle='rgba(38,50,56,.55)';ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(hoverX,y(ele),5,0,7);ctx.fillStyle='#e53935';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    return {km,ele};
  }
  return null;
}

/* 구간별 통과 예상 시각 (관리자용) */
function hm(str){ const m=String(str||'').match(/^(\d{1,2}):([0-5]\d)$/); return m?(+m[1])*60+(+m[2]):null; }
function paceMin(str){ const m=String(str||'').match(/^(\d+):([0-5]?\d)$/); return m?(+m[1])+(+m[2])/60:null; }
function toHm(mins){ let t=Math.round(mins); t=((t%1440)+1440)%1440; return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
function paceStr(p){ const s=Math.round(p*60); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function renderPace(){
  if(!ADMIN) return;
  const ev=DATA.event||{start:'08:00',lead:'3:30',last:'9:00'};
  const st=hm(ev.start)||0, lead=paceMin(ev.lead)||3.5, lim=C.limitPace||null;
  const bands=[{label:'선두 '+ev.lead, pace:lead}];
  if(lim&&lim>lead){
    for(let i=1;i<=3;i++){ const p=lead+(lim-lead)*i/4; bands.push({label:paceStr(p), pace:p}); }
    bands.push({label:'제한 '+paceStr(lim), pace:lim, limit:true});
  } else { [4.5,5.5,6.5,paceMin(ev.last)||9].forEach(p=>{ if(p>lead) bands.push({label:paceStr(p), pace:p}); }); }
  document.getElementById('mcv-paceLabel').textContent='— '+C.name+' · 출발 '+ev.start+(C.limit?' · 제한 '+C.limit:'');
  const step=+document.getElementById('mcv-paceStep').value, onlyPoi=document.getElementById('mcv-paceOnlyPoi').checked;
  const tk=turnOf(C);
  const marks=[];
  if(onlyPoi){
    C.pois.forEach(p=>passInfo(p).forEach(r=>marks.push({km:r.km, label:CAT[p.cat].icon+' '+p.name+(r.d?' '+dirLabel(r.d):'')})));
    marks.sort((a,b)=>a.km-b.km);
  } else {
    for(let k=step;k<C.total_km;k+=step) marks.push({km:k,label:''});
    if(tk!=null) marks.push({km:tk,label:'↩ '+((C.turnNames&&C.turnNames[0])?String(C.turnNames[0]):'반환')});
    marks.push({km:C.total_km,label:'피니시'});
    marks.sort((a,b)=>a.km-b.km);
  }
  let h='<div><table><thead><tr><th>거리</th><th>지점</th>'+
    bands.map(b=>'<th style="text-align:right'+(b.limit?';color:#c62828':'')+'">'+esc(b.label)+'</th>').join('')+'</tr></thead><tbody>';
  marks.forEach(m=>{
    const isTurn=(tk!=null&&Math.abs(m.km-tk)<1e-6);
    h+='<tr'+(isTurn?' style="background:#fff8e1"':'')+'><td class="mcv-km">'+m.km.toFixed(2)+' km</td><td style="color:#607d8b;white-space:nowrap">'+esc(m.label)+'</td>'+
      bands.map(b=>'<td class="mcv-qty"'+(b.limit?' style="color:#c62828;font-weight:700"':'')+'>'+toHm(st+m.km*b.pace)+'</td>').join('')+'</tr>';
  });
  h+='</tbody></table></div>';
  document.getElementById('mcv-paceTable').innerHTML=h;
}

  set('mcv-stGain', C.hasEle?'+'+C.gain+' m':'—');
  set('mcv-stMin', C.hasEle?C.ele_min.toFixed(0)+' m':'—');
  set('mcv-stMax', C.hasEle?C.ele_max.toFixed(0)+' m':'—');
  set('mcv-tblCourseLabel', '— '+C.name+' 기준'+(tk!=null?' · ↩ '+tk.toFixed(2)+'km 반환':''));
  set('mcv-supLabel', '— '+C.name+' 기준');
}
const courseSeg=document.getElementById('mcv-courseSeg');
courseSeg.innerHTML=DATA.order.map((id,i)=>'<button data-c="'+id+'"'+(i===0?' class="mcv-on"':'')+'>'+esc(DATA.courses[id].name)+'</button>').join('');
function mcvSafe(name, fn){
  try{ fn(); }
  catch(e){ console.error('[코스도] '+name+' 오류:', e); }
}
/* ── 전 코스 함께 보기 ──
   같은 길을 쓰는 종목이 정확히 포개져 어느 쪽인지 알 수 없던 문제를 함께 푼다.
   보고 있는 코스는 실제 길 위에 그대로 두고, 나머지만 좌우로 조금씩 벌려 나란히 그린다. */
let showAll=false, allObjs=[];
function clearAll(){ allObjs.forEach(h=>{ try{ h.rm(); }catch(e){} }); allObjs=[]; }
function fanOff(id){
  if(!LS.fan) return 0;
  const rest=DATA.order.filter(k=>k!==curKey);
  const i=rest.indexOf(id);
  if(i<0) return 0;
  const k=Math.floor(i/2)+1;
  return (i%2===0?-1:1) * k * vSepM(+LS.fanGap || 11);
}
function drawAllCourses(){
  clearAll();
  const note=document.getElementById('mcv-allNote');
  if(!showAll){ if(note) note.classList.remove('mcv-on'); return; }
  DATA.order.forEach(k=>{
    if(k===curKey) return;
    const c=DATA.courses[k];
    if(!c || !c.track || c.track.length<2) return;
    const off=fanOff(k);
    const path=off ? offsetPath(c.track.map(q=>[q[0],q[1]]), off) : c.track;
    const pts=cleanPath(path);
    if(pts.length<2) return;
    if(OSM){
      const pl=L.polyline(pts,{color:c.color||'#8e8e93', weight:Math.max(2.5, LS.w-2),
        opacity:.55, interactive:false}).addTo(kmap);
      allObjs.push({rm:()=>kmap.removeLayer(pl)});
    } else {
      const pl=new kakao.maps.Polyline({path:pts.map(a=>new kakao.maps.LatLng(a[0],a[1])),
        strokeColor:c.color||'#8e8e93', strokeWeight:Math.max(2.5, LS.w-2), strokeOpacity:.55});
      pl.setMap(kmap); allObjs.push({rm:()=>pl.setMap(null)});
    }
  });
  if(note){
    note.innerHTML='<b>전 코스 보기</b>'+DATA.order.map(k=>{
      const c=DATA.courses[k];
      return '<button type="button" class="mcv-allChip'+(k===curKey?' mcv-on':'')+'" data-ac="'+k+'">'+
        '<i style="background:'+(c.color||'#8e8e93')+'"></i>'+esc(c.name)+
        (k===curKey?' <b>보는 중</b>':'')+'</button>';
    }).join('')+'<span style="color:var(--mut)">눌러서 그 종목으로 · 같은 길을 쓰는 구간은 나란히 벌려 그렸습니다</span>';
    note.classList.add('mcv-on');
    note.querySelectorAll('[data-ac]').forEach(b=>b.onclick=()=>{
      if(b.dataset.ac!==curKey) setCourse(b.dataset.ac);
    });
  }
}
/* 모든 코스와 시설을 한 화면에 */
function fitAllCourses(){
  const pts=[];
  DATA.order.forEach(k=>{
    const c=DATA.courses[k];
    if(!c||!c.track||!c.track.length) return;
    const st=Math.max(1, Math.floor(c.track.length/300));
    for(let i=0;i<c.track.length;i+=st) pts.push(c.track[i]);
    pts.push(c.track[c.track.length-1]);
    (c.pois||[]).forEach(p=>{ if(isFinite(p.lat)&&isFinite(p.lon)) pts.push([p.lat,p.lon]); });
  });
  if(pts.length>1) mapFit(pts);
}
const allBtn=document.getElementById('mcv-allBtn');
if(allBtn) allBtn.addEventListener('click', ()=>{
  showAll=!showAll;
  allBtn.classList.toggle('mcv-on', showAll);
  allBtn.textContent = showAll ? '⛶ 이 코스만' : '⛶ 전 코스 보기';
  /* 배율을 먼저 맞추고 그린다 — 벌리는 폭이 배율에 따라 달라지므로
     순서가 뒤바뀌면 예전 배율 기준으로 그려져 선이 덜 벌어진다 */
  if(showAll){
    fitAllCourses();
    requestAnimationFrame(()=>{ vSepShown=vMPerPx(); drawAllCourses(); scheduleArrows(); });
  } else {
    drawAllCourses();
    mcvSafe('지도', ()=>rebuildMap(true));
    scheduleArrows();
  }
});
/* ══ 로드뷰 (카카오 지도일 때) — 누른 자리 · 시설 카드 · 코스 따라 200m 씩 ══ */
const vRV={on:false, rv:null, client:null, walker:null, km:null, seq:0, big:false};
function vRvOk(){ return !OSM && typeof kakao!=='undefined' && kakao.maps && !!kakao.maps.Roadview && !!kakao.maps.RoadviewClient; }
function vRvTip(t, ms){
  const el=document.getElementById('mcv-rvTip'); if(!el) return;
  el.textContent=t||''; el.classList.toggle('mcv-on', !!t);
  clearTimeout(el.__t); if(t) el.__t=setTimeout(()=>el.classList.remove('mcv-on'), ms||3200);
}
function vNearKm(lat, lon){
  const tr=C && C.track; if(!tr || tr.length<2 || cum.length!==tr.length) return null;
  const K=111320, cl=Math.cos(lat*Math.PI/180); let best=null;
  for(let i=1;i<tr.length;i++){
    const a=tr[i-1], b=tr[i];
    const ax=(a[1]-lon)*K*cl, ay=(a[0]-lat)*K, bx=(b[1]-lon)*K*cl, by=(b[0]-lat)*K;
    const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy; let t=L2?-(ax*dx+ay*dy)/L2:0; t=t<0?0:(t>1?1:t);
    const d=Math.hypot(ax+t*dx, ay+t*dy);
    if(!best || d<best.d) best={d, km:(cum[i-1]+t*(cum[i]-cum[i-1]))/1000};
  }
  return best;
}
function vRvBearing(km){
  const tot=(C && C.total_km) || (cum.length?cum[cum.length-1]/1000:0);
  const a=latlngAtKm(Math.max(0, km-0.02)), b=latlngAtKm(Math.min(tot, km+0.04));
  const y=(b[1]-a[1])*Math.cos(a[0]*Math.PI/180), x=b[0]-a[0];
  return ((Math.atan2(y, x)*180/Math.PI)+360)%360;
}
function vRvInfo(){
  const el=document.getElementById('mcv-rvInfo'), on=vRV.km!=null && C;
  if(el) el.textContent = on ? (C.name||'코스')+' '+vRV.km.toFixed(2)+' km 지점' : '코스 밖';
  const tot=(C && C.total_km) || 0;
  const p=document.getElementById('mcv-rvPrev'), n=document.getElementById('mcv-rvNext');
  if(p) p.disabled=!on || vRV.km<=0.001; if(n) n.disabled=!on || vRV.km>=tot-0.001;
}
function vRvWalker(lat, lon, pan){
  if(!kmap || OSM) return;
  const ll=new kakao.maps.LatLng(lat, lon);
  if(!vRV.walker){
    const el=document.createElement('div'); el.className='mcv-rvWalker';
    el.innerHTML='<i class="mcv-rvCone"></i><b class="mcv-rvMan">🚶</b>';
    vRV.walker=new kakao.maps.CustomOverlay({position:ll, content:el, xAnchor:0.5, yAnchor:0.5, zIndex:90});
    vRV.walker.__el=el;
  }
  vRV.walker.setPosition(ll); vRV.walker.setMap(kmap);
  if(pan!=null){ const c=vRV.walker.__el.querySelector('.mcv-rvCone'); if(c) c.style.transform='rotate('+pan+'deg)'; }
}
function vRvToggle(on){
  if(!kReady || !vRvOk()){ vRvTip('이 지도에서는 로드뷰를 쓸 수 없습니다'); return; }
  vRV.on = (on!=null) ? !!on : !vRV.on;
  try{ vRV.on ? kmap.addOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW) : kmap.removeOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW); }catch(e){}
  const b=document.getElementById('mcv-rvBtn'); if(b){ b.classList.toggle('mcv-on', vRV.on); b.setAttribute('aria-pressed', vRV.on?'true':'false'); }
  if(vRV.on) vRvTip('파랗게 칠해진 길을 누르면 그 자리 로드뷰가 열립니다'); else { vRvTip(''); vRvClose(); }
}
function vRvOpen(lat, lon, opt){
  opt=opt||{};
  if(!kReady || !vRvOk()){ vRvTip('이 지도에서는 로드뷰를 쓸 수 없습니다'); return; }
  const wrap=document.getElementById('mcv-rvWrap'), msg=document.getElementById('mcv-rvMsg');
  wrap.classList.add('mcv-on');
  if(!vRV.rv){
    vRV.rv=new kakao.maps.Roadview(document.getElementById('mcv-rvPano'));
    vRV.client=new kakao.maps.RoadviewClient();
    kakao.maps.event.addListener(vRV.rv, 'position_changed', ()=>{
      const p=vRV.rv.getPosition(); if(!p) return;
      const n=vNearKm(p.getLat(), p.getLng()); vRV.km=(n && n.d<150)?n.km:null;
      vRvWalker(p.getLat(), p.getLng(), (vRV.rv.getViewpoint()||{}).pan); vRvInfo();
    });
    kakao.maps.event.addListener(vRV.rv, 'viewpoint_changed', ()=>{ const v=vRV.rv.getViewpoint(); if(v && vRV.walker){ const c=vRV.walker.__el.querySelector('.mcv-rvCone'); if(c) c.style.transform='rotate('+v.pan+'deg)'; } });
  }
  if(opt.km!=null) vRV.km=opt.km; else { const n=vNearKm(lat, lon); vRV.km=(n && n.d<150)?n.km:null; }
  vRvInfo();
  msg.textContent='로드뷰를 찾는 중…'; msg.classList.add('mcv-on');
  const seq=++vRV.seq, R=opt.radius||60, pos=new kakao.maps.LatLng(lat, lon);
  vRV.client.getNearestPanoId(pos, R, panoId=>{
    if(seq!==vRV.seq) return;
    if(!panoId){ msg.textContent='이 근처 '+R+'m 안에는 로드뷰 사진이 없습니다'; vRvWalker(lat, lon); return; }
    msg.classList.remove('mcv-on');
    vRV.rv.setPanoId(panoId, pos);
    if(vRV.km!=null) vRV.rv.setViewpoint({pan:vRvBearing(vRV.km), tilt:0, zoom:0});
    setTimeout(()=>{ try{ vRV.rv.relayout(); }catch(e){} }, 30);
  });
  vRvWalker(lat, lon);
}
function vRvStep(dir){
  if(vRV.km==null || !C) return;
  const tot=C.total_km || cum[cum.length-1]/1000;
  const km=Math.max(0, Math.min(tot, vRV.km+dir*0.2)), ll=latlngAtKm(km);
  vRvOpen(ll[0], ll[1], {km, radius:80});
  try{ const L2=new kakao.maps.LatLng(ll[0], ll[1]); if(!kmap.getBounds().contain(L2)) kmap.panTo(L2); }catch(e){}
}
function vRvClose(){
  const w=document.getElementById('mcv-rvWrap'); if(w) w.classList.remove('mcv-on','mcv-big');
  vRV.big=false; vRV.seq++;
  if(vRV.walker) vRV.walker.setMap(null);
}
(function(){
  const on=(id,f)=>{ const b=document.getElementById(id); if(b) b.addEventListener('click', f); };
  on('mcv-rvBtn', ()=>vRvToggle());
  on('mcv-rvClose', vRvClose);
  on('mcv-rvPrev', ()=>vRvStep(-1));
  on('mcv-rvNext', ()=>vRvStep(1));
  on('mcv-rvBig', ()=>{ vRV.big=!vRV.big; document.getElementById('mcv-rvWrap').classList.toggle('mcv-big', vRV.big); setTimeout(()=>{ try{ vRV.rv && vRV.rv.relayout(); }catch(e){} }, 60); });
  document.addEventListener('keydown', e=>{ const w=document.getElementById('mcv-rvWrap'); if(e.key==='Escape' && w && w.classList.contains('mcv-on')) vRvClose(); });
  if(OSM){ const b=document.getElementById('mcv-rvBtn'); if(b) b.style.display='none'; }
  /* 점검용 — 콘솔에서 MCV_RV.state 로 로드뷰 상태를 본다 */
  window.MCV_RV={state:vRV, bearing:vRvBearing, at:km=>latlngAtKm(km), map:()=>kmap, open:vRvOpen, info:(h,la,lo)=>showInfo(h,la,lo)};
})();
function setCourse(key){
  curKey=key; C=DATA.courses[key];
  courseSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('mcv-on',b.dataset.c===key));
  mcvSafe('거리계산', computeCum);
  mcvSafe('지도', ()=>rebuildMap(true));
  mcvSafe('고저도', ()=>drawChart(null));
  mcvSafe('시설표', renderTables);
  mcvSafe('물자', renderSupplies);
  mcvSafe('페이스', renderPace);
  mcvSafe('범례', renderLegend);
  mcvSafe('통계', renderStats);
  mcvSafe('로드뷰', ()=>{ if(vRV.rv && document.getElementById('mcv-rvWrap').classList.contains('mcv-on')){ const p=vRV.rv.getPosition(); if(p){ const n=vNearKm(p.getLat(),p.getLng()); vRV.km=(n&&n.d<150)?n.km:null; vRvInfo(); } } });
  if(showAll){ mcvSafe('전코스', drawAllCourses); mcvSafe('맞추기', fitAllCourses); }
}
courseSeg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setCourse(b.dataset.c)));
mcvSafe('거리계산', computeCum); mcvSafe('고저도', ()=>drawChart(null)); mcvSafe('시설표', renderTables);
mcvSafe('물자', renderSupplies); mcvSafe('페이스', renderPace); mcvSafe('범례', renderLegend); mcvSafe('통계', renderStats);
}   /* __MCV_LOADED__ 가드 끝 */
</script>
