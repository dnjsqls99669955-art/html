<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f5f6f8">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>파란상상 · 대회 목록</title>
<!-- mcv-list list-2 — 제작기 「🚀 GitHub로 올리기」가 지정한 주소에 자동으로 만들고 갱신하는 직원용 대회 목록. 옆의 ./staff.json 을 읽는다.
     기본 관리자(총관리자)는 모든 대회, 그 밖의 계정은 자기 계정이 등록된 대회만 본다. 대회를 누르면 발행본에 자동 로그인 -->
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:rgba(0,0,0,.08);--txt:#1d1d1f;--sub:#6e6e73;--blue:#0f62c9;--blue2:#1a7cf0;--red:#d93025;--green:#1e8e3e;--chip:#eef0f3;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);--r:18px}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--line:rgba(255,255,255,.1);--txt:#f5f5f7;--sub:#98989d;--blue:#3b8cff;--blue2:#5aa0ff;--chip:#2c2c2e;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.logo-pill{display:inline-flex;align-items:center;background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.logo-pill img{display:block;height:22px;width:auto}

/* ── 로그인 문 ── */
.gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(120% 80% at 50% 0%,#e8f1fd 0%,var(--bg) 60%);transition:opacity .35s ease,visibility .35s}
@media (prefers-color-scheme:dark){.gate{background:radial-gradient(120% 80% at 50% 0%,#0b2242 0%,#000 60%)}}
.gate.off{opacity:0;visibility:hidden;pointer-events:none}
.gbox{width:min(100%,380px);display:flex;flex-direction:column;gap:12px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.gbrand{align-self:center;margin-bottom:18px;background:#fff;border-radius:22px;padding:18px 26px;box-shadow:var(--shadow)}
.gbrand img{display:block;width:170px;height:auto}
.gbox h1{margin:0;text-align:center;font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.gbox p{margin:0 0 10px;text-align:center;color:var(--sub);font-size:.92rem}
.field{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.field input{display:block;width:100%;border:0;background:transparent;padding:16px 18px;font-size:1.05rem;outline:none}
.field input+input{border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:15px 18px;font-weight:600;font-size:1.02rem;cursor:pointer;background:var(--blue);color:#fff;transition:transform .15s ease,filter .15s ease,background .2s;text-decoration:none}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn.ghost{background:var(--chip);color:var(--txt)}
.btn[disabled]{opacity:.5;pointer-events:none}
.err{min-height:1.3em;text-align:center;color:var(--red);font-size:.88rem;font-weight:600}
.err.shake{animation:shake .4s}
.gfoot{margin-top:28px;color:var(--sub);font-size:.78rem;text-align:center}

/* ── 머리 ── */
header{position:sticky;top:0;z-index:10;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.hrow{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hrow .sp{flex:1}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.05rem;transition:transform .15s}
.icon-btn:active{transform:scale(.9)}
.icon-btn.spin{animation:spin .8s linear}
main{max-width:760px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 16px;flex-wrap:wrap}
.hello h2{margin:0;font-size:1.75rem;font-weight:700;letter-spacing:-.025em;line-height:1.2}
.hello .who{color:var(--sub);font-size:.9rem;margin-top:4px}
.hello .who b{color:var(--txt);font-weight:600}
.role{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);margin-left:6px;vertical-align:1px}
.out{border:0;background:none;color:var(--blue);font-size:.9rem;cursor:pointer;padding:4px 0}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1 1 200px;display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:0 12px}
.search input{flex:1;border:0;background:transparent;padding:10px 0;outline:none;min-width:0}
.tgl{font-size:.82rem;color:var(--sub);display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}

/* ── 대회 카드 ── */
.ev{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 16px;margin-bottom:14px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.ev.archived{opacity:.5}
.ev .top{display:flex;align-items:flex-start;gap:10px}
.ev h3{margin:0;font-size:1.15rem;font-weight:700;letter-spacing:-.015em;line-height:1.35;flex:1}
.ev .date{color:var(--sub);font-size:.85rem;margin-top:2px}
.ev .hide{border:0;background:none;color:var(--sub);font-size:.78rem;cursor:pointer;padding:2px 0;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.c{font-size:.76rem;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--sub);font-weight:600}
.c.on{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.c.emg{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);animation:pulse 1.6s ease-in-out infinite}
.c.me{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue)}
.go{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.go .btn{flex:1 1 auto}
.go .btn.main{flex:1 1 100%}
.go .btn small{font-weight:500;opacity:.8;font-size:.78rem}
.more{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.more a{font-size:.82rem;color:var(--blue);text-decoration:none;padding:6px 10px;border-radius:10px;background:var(--chip);font-weight:600}
.more a:active{opacity:.7}
.meta{font-size:.74rem;color:var(--sub);margin-top:10px}
.none{color:var(--sub);font-size:.88rem;margin-top:12px}
.empty{text-align:center;color:var(--sub);padding:56px 12px;line-height:1.7}
.empty .big{font-size:2.4rem;margin-bottom:8px}
.skel{height:132px;border-radius:var(--r);background:linear-gradient(90deg,var(--card) 0%,var(--chip) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:14px}
.foot{display:flex;justify-content:center;margin-top:26px;opacity:.9}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.55}}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

let DATA=null, LIVE={}, ME=null, TIMER=null, LOADING=null;
function sha256Hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=new TextEncoder().encode(String(str)); const L=b.length, n=((L+9+63)>>6)<<6; const m=new Uint8Array(n); m.set(b); m[L]=0x80;
  const dv=new DataView(m.buffer); dv.setUint32(n-4,(L*8)>>>0); dv.setUint32(n-8,Math.floor(L*8/4294967296));
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]; const W=new Uint32Array(64); const rr=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let i=0;i<n;i+=64){
    for(let t=0;t<16;t++) W[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){ const s0=rr(W[t-15],7)^rr(W[t-15],18)^(W[t-15]>>>3), s1=rr(W[t-2],17)^rr(W[t-2],19)^(W[t-2]>>>10); W[t]=(W[t-16]+s0+W[t-7]+s1)>>>0; }
    let a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let t=0;t<64;t++){ const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[t]+W[t])>>>0, S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&bb)^(a&c)^(bb&c), t2=(S0+mj)>>>0; h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=bb; bb=a; a=(t1+t2)>>>0; }
    H=[(H[0]+a)>>>0,(H[1]+bb)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>('00000000'+x.toString(16)).slice(-8)).join('');
}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
const fmt=t=>{ if(!t) return ''; const d=new Date(+t); return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); };
const fmtDate=s=>{ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||'')); if(!m) return esc(s||''); const d=new Date(+m[1],+m[2]-1,+m[3]); return m[1]+'년 '+(+m[2])+'월 '+(+m[3])+'일 ('+'일월화수목금토'[d.getDay()]+')'; };

function fileUrl(n){ return './'+encodeURI(String(n).replace(/\.html?$/i,'')); }

/* ── 로그인 — 번호는 저장하지 않는다. 목록용 해시(h0)·패트롤 해시(pl0)만 30일 기억하고, 올릴 때마다 바뀌는 등록부와 매번 다시 대조한다 ── */
function isDef(me){ return !!me && ACC.some(a=>a.h===me.h0); }
function memberOf(e, me){
  if(!me || !e || !e.live || !Array.isArray(e.acc)) return null;
  const a=e.acc.find(x=>x.l===me.h0); if(a) return {h:a.h, r:a.r||'lead', s:!!a.s};
  if(e.pl && e.pt && e.pl===me.pl0) return {h:e.pt, r:'patrol', s:false};
  return null;
}
function myEvents(me){ const def=isDef(me); return ((DATA&&DATA.events)||[]).map(e=>{ const m=memberOf(e, me); if(!m && !def) return null; return {e, m, full:def || !!(m&&m.s)}; }).filter(Boolean); }
function loadMe(){ try{ const v=JSON.parse(localStorage.getItem('mcvlist_me')||'null'); if(v && v.h0 && v.n && v.exp>Date.now()) return v; }catch(e){} return null; }
function setMe(v){ try{ if(v) localStorage.setItem('mcvlist_me', JSON.stringify(v)); else localStorage.removeItem('mcvlist_me'); }catch(e){} }
function roleText(me){ if(isDef(me)) return '총관리자'; const rs=new Set(myEvents(me).map(x=>x.m && (x.m.s?'총관리자':ROLE_LABEL[x.m.r]||x.m.r)).filter(Boolean)); return [...rs].join(' · '); }

function gate(){
  ME=loadMe();
  if(ME && DATA && !isDef(ME) && !myEvents(ME).length){ ME=null; setMe(null); }   /* 계정이 모든 대회에서 빠졌다 */
  $('gate').classList.toggle('off', !!ME);
  if(ME){ render(); if(!TIMER) TIMER=setInterval(load, 60000); }
  else { if(TIMER){ clearInterval(TIMER); TIMER=null; } setTimeout(()=>{ try{ $('gn').focus(); }catch(e){} }, 350); }
}
function gerr(t){ const el=$('gerr'); el.textContent=t||''; el.classList.remove('shake'); if(t){ void el.offsetWidth; el.classList.add('shake'); } }
$('gform').onsubmit=async e=>{ e.preventDefault();
  const n=norm($('gn').value), p=String($('gp').value||'').replace(/\D/g,'');
  if(!n){ gerr('이름을 넣어 주세요'); return; } if(!/^\d{4}$/.test(p)){ gerr('번호 4자리를 넣어 주세요'); return; }
  $('gbtn').disabled=true; $('gbtn').textContent='확인 중…';
  if(!DATA) await load(true);
  $('gbtn').disabled=false; $('gbtn').textContent='로그인';
  const cand={n, h0:sha256Hex(SALT+'|'+n+'|'+p), pl0:sha256Hex(SALT+'|patrol|'+p), exp:Date.now()+30*86400000};
  if(!isDef(cand)){
    if(!DATA){ gerr('목록을 불러오지 못했습니다 — 인터넷 연결을 확인해 주세요'); return; }
    if(!myEvents(cand).length){ gerr('이름·번호가 맞지 않거나, 배정된 대회가 없습니다'); $('gp').value=''; return; }
  }
  gerr(''); $('gp').value=''; setMe(cand); gate(); load(); };
$('out').onclick=()=>{ setMe(null); LIVE={}; gate(); };
$('reload').onclick=()=>{ const b=$('reload'); b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin'); load(); };

/* ── 그리기 ── */
function filesFor(x){
  const all=(x.e.files||[]).slice().sort((a,b)=>{ const ia=ORDER.indexOf(a.label), ib=ORDER.indexOf(b.label); return (ia<0?99:ia)-(ib<0?99:ib) || String(a.name).localeCompare(b.name,'ko'); });
  if(x.full) return all;
  const ok=ALLOW[x.m.r]||['운영용·통합','참가자용'];
  return all.filter(f=>ok.includes(f.label));
}
function render(){
  if(!ME) return;
  const list=$('list'), def=isDef(ME);
  $('hi').textContent=def?'모든 대회':'내 대회';
  $('who').innerHTML='<b>'+esc(ME.n)+'</b>'+(roleText(ME)?'<span class="role">'+esc(roleText(ME))+'</span>':'');
  if(!DATA){ list.innerHTML=LOADING?'<div class="skel"></div><div class="skel"></div>':'<div class="empty"><div class="big">📡</div>목록을 불러오지 못했습니다.<br>연결을 확인하고 ↻ 를 눌러 주세요.</div>'; return; }
  const q=($('q').value||'').trim().toLowerCase(), showAll=$('showAll').checked, hid=hidden();
  let evs=myEvents(ME).sort((a,b)=>(+b.e.at||0)-(+a.e.at||0));
  $('tools').style.display=(evs.length>2||def)?'':'none'; $('tglWrap').style.display=def?'':'none';
  if(q) evs=evs.filter(x=>String(x.e.title||'').toLowerCase().includes(q));
  const shown=evs.filter(x=>!def || showAll || !hid.includes(x.e.id));
  if(!shown.length){ list.innerHTML='<div class="empty"><div class="big">🗂</div>'+(evs.length?(q?'검색 결과가 없습니다.':'숨긴 대회뿐입니다 — 「숨긴 대회」를 켜 보세요.'):(def?'아직 올린 대회가 없습니다.<br>제작기에서 「🚀 GitHub로 올리기」를 하면 여기에 생깁니다.':'배정된 대회가 없습니다.<br>운영본부에 문의해 주세요.'))+'</div>'; return; }
  list.innerHTML=shown.map((x,i)=>{ const e=x.e, lv=LIVE[e.id], isHid=hid.includes(e.id), files=filesFor(x);
    let chips='';
    if(x.m) chips+='<span class="c me">'+esc(x.m.s?'총관리자':(ROLE_LABEL[x.m.r]||x.m.r))+'</span>';
    if(x.full && e.live){ if(lv&&lv.err) chips+='<span class="c">실시간 확인 안 됨</span>'; else if(lv){ chips+='<span class="c '+(lv.online?'on':'')+'">● 접속 '+lv.online+'명</span>'; if(lv.emg) chips+='<span class="c emg">🚨 응급 '+lv.emg+'건</span>'; } }
    const main=files.find(f=>f.label!=='참가자용')||files[0], rest=files.filter(f=>f!==main);
    let go='';
    if(!main) go='<div class="none">아직 입장할 파일이 올라오지 않았습니다.</div>';
    else if(x.m && x.m.r==='patrol' && !x.full){
      go='<div class="go"><a class="btn" href="'+fileUrl(main.name)+'" data-ev="'+esc(e.id)+'" data-pt="patrol">🏍 레이스패트롤</a><a class="btn" href="'+fileUrl(main.name)+'" data-ev="'+esc(e.id)+'" data-pt="pacer">🏃 페이스메이커</a></div>';
    } else go='<div class="go"><a class="btn main" href="'+fileUrl(main.name)+'" data-ev="'+esc(e.id)+'">'+(ICON[main.label]||'▶')+' '+esc(LABEL[main.label]||main.label||'입장')+' 열기</a></div>';
    if(rest.length) go+='<div class="more">'+rest.map(f=>'<a href="'+fileUrl(f.name)+'" data-ev="'+esc(e.id)+'">'+(ICON[f.label]||'')+' '+esc(LABEL[f.label]||f.label||String(f.name).replace(/\.html?$/i,''))+'</a>').join('')+'</div>';
    return '<div class="ev'+(isHid?' archived':'')+'" style="animation-delay:'+Math.min(i*60,360)+'ms"><div class="top"><div style="flex:1"><h3>'+esc(e.title||'(제목 없음)')+'</h3>'+(e.date?'<div class="date">'+fmtDate(e.date)+'</div>':'')+'</div>'+
      (def?'<button class="hide" data-hide="'+esc(e.id)+'">'+(isHid?'다시 보이기':'숨기기')+'</button>':'')+'</div>'+
      (chips?'<div class="chips">'+chips+'</div>':'')+go+
      (x.full?'<div class="meta">마지막 올림 '+fmt(e.at)+(e.ver?' · '+esc(e.ver):'')+'</div>':'')+'</div>'; }).join('');
  list.querySelectorAll('[data-hide]').forEach(b=>{ b.onclick=()=>{ const id=b.dataset.hide; let h=hidden(); if(h.includes(id)) h=h.filter(v=>v!==id); else h.push(id); setHidden(h); render(); }; });
  list.querySelectorAll('a[data-ev]').forEach(a=>{ a.onclick=()=>handoff(a.dataset.ev, a.dataset.pt||''); });
}
/* 대회로 넘어갈 때 — 그 발행본의 로그인 해시를 같은 탭의 sessionStorage 에 둔다. 발행본이 한 번 읽고 지운다 */
function handoff(id, pt){
  const x=myEvents(ME).find(v=>v.e.id===id); if(!x || !x.m || !x.e.live) return;
  try{ sessionStorage.setItem('mcv-handoff', JSON.stringify({k:x.e.live.key, n:ME.n, h:x.m.h, pt:(x.m.r==='patrol'?(pt||'patrol'):''), at:Date.now()})); }catch(e){}
}

/* ── 실시간 (관리자만): 발행본과 같은 공개 apiKey 로 people·pings 만 읽는다 ── */
async function liveOne(e){
  const l=e.live; if(!l||!l.project||!l.apiKey||!l.key) return;
  const base='https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(l.project)+'/databases/(default)/documents/liveEvents/'+encodeURIComponent(l.key)+'/';
  const val=v=>{ if(!v) return null; if('integerValue' in v) return +v.integerValue; if('doubleValue' in v) return v.doubleValue; if('booleanValue' in v) return v.booleanValue; if('stringValue' in v) return v.stringValue; return null; };
  try{ const [pr, gr]=await Promise.all([fetch(base+'people?pageSize=300&key='+encodeURIComponent(l.apiKey)), fetch(base+'pings?pageSize=300&key='+encodeURIComponent(l.apiKey))]);
    if(!pr.ok||!gr.ok) throw new Error('http'); const pj=await pr.json(), gj=await gr.json(); const now=Date.now();
    const seen=new Map(); (pj.documents||[]).forEach(d=>{ const f=d.fields||{}; const name=val(f.name), role=val(f.role)||'', at=+val(f.at)||0, gone=+val(f.gone)||0, out=+val(f.out)||0; if(!name) return; const k=name+'|'+role; const cur=seen.get(k); if(!cur||at>cur.at) seen.set(k,{at,gone,out}); });
    let online=0; seen.forEach(p=>{ if(p.gone>p.at||p.out>=p.at) return; if(now-p.at<90000) online++; });
    const emg=(gj.documents||[]).filter(d=>{ const f=d.fields||{}; return val(f.active)!==false; }).length;
    LIVE[e.id]={online, emg};
  }catch(err){ LIVE[e.id]={err:true}; }
}
async function load(quiet){
  LOADING=true; if(!quiet && ME && !DATA) render();
  try{ const r=await fetch(JSON_URL+'?t='+Date.now(), {cache:'no-store'}); if(!r.ok) throw new Error(r.status); DATA=await r.json(); }catch(e){ if(!DATA) DATA=null; }
  LOADING=false;
  if(quiet) return;
  if(ME && DATA && !isDef(ME) && !myEvents(ME).length){ gate(); return; }
  render();
  if(ME && DATA){ await Promise.all(myEvents(ME).filter(x=>x.full && x.e.live).map(x=>liveOne(x.e))); render(); }
}
$('q').oninput=render; $('showAll').onchange=render;
window.addEventListener('pageshow', ev=>{ if(ev.persisted && ME) load(); });   /* 대회에서 뒤로 돌아왔을 때 새로 */
gate(); load();
</script>
