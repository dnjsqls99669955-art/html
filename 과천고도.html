function drawMarker(km,ele,txt,color,up){const x=xScale(km),y=yScale(ele);ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,plot.top+plot.height);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.font='12px "Noto Sans KR",Arial';const label=`${txt} ${ele.toFixed(1)}m / ${km.toFixed(2)}km`,tw=ctx.measureText(label).width+18,th=26;let bx=Math.max(plot.left+4,Math.min(x-tw/2,plot.left+plot.width-tw-4)),by=up?y-42:y+14;by=Math.max(plot.top+4,Math.min(by,plot.top+plot.height-th-4));ctx.fillStyle=color;ctx.beginPath();roundRect(ctx,bx,by,tw,th,8);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,bx+tw/2,by+th/2)}
function draw(){drawGrid();drawLine();drawMarker(summary.maxKm,summary.maxEle,'최고','#ef4444',true);drawMarker(summary.minKm,summary.minEle,'최저','#10b981',false)}
function nearestPoint(mouseX){const km=Math.max(0,Math.min(xMax,((mouseX-plot.left)/plot.width)*xMax));let lo=0,hi=data.length-1;while(lo<hi){const mid=Math.floor((lo+hi)/2);if(data[mid].km<km)lo=mid+1;else hi=mid}const a=data[Math.max(0,lo-1)],b=data[Math.min(data.length-1,lo)];return Math.abs(a.km-km)<Math.abs(b.km-km)?a:b}
function showTooltip(e){const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;if(mx<plot.left||mx>plot.left+plot.width||my<plot.top||my>plot.top+plot.height){tip.style.display='none';draw();return}const p=nearestPoint(mx);draw();const px=xScale(p.km),py=yScale(p.ele);ctx.strokeStyle='rgba(17,24,39,.45)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(px,plot.top);ctx.lineTo(px,plot.top+plot.height);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#111827';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();ctx.stroke();tip.innerHTML=`<b>${p.km.toFixed(2)} km</b><br>고도: ${p.ele.toFixed(1)} m`;tip.style.left=px+'px';tip.style.top=py+'px';tip.style.display='block'}
canvas.addEventListener('mousemove',showTooltip);canvas.addEventListener('mouseleave',()=>{tip.style.display='none';draw()});canvas.addEventListener('touchstart',e=>{if(e.touches[0])showTooltip(e.touches[0])},{passive:true});canvas.addEventListener('touchmove',e=>{if(e.touches[0])showTooltip(e.touches[0])},{passive:true});window.addEventListener('resize',setup);setup();
</script></body></html>
